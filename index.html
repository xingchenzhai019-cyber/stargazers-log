<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starred repositories</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Personal software shelf</p>
        <h1>Starred repositories</h1>
        <p>A small log of tools, ideas, and projects worth keeping close.</p>
      </header>

      <section aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Recently saved</h2>
          <span id="repository-count" class="repository-count" aria-live="polite"></span>
        </div>
        <ul id="repository-list" class="repository-list" aria-live="polite">
          <li class="status-message">Loading repositories...</li>
        </ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
